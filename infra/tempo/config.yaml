server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"

storage:
  trace:
    backend: s3
    s3:
      bucket: loki-logs
      endpoint: asr-minio:9000
      access_key: ${S3_ACCESS_KEY:-torchdev}
      secret_key: ${S3_SECRET_KEY:-torchdev-secret}
      insecure: true
