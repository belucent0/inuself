user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Docker 내장 DNS 사용, 5초마다 재조회 (컨테이너 IP 변경 감지)
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 5s;

    # WebSocket 연결을 위한 Upgrade 헤더 매핑
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Proxy Protocol 처리 (L4/L7 로드밸런서 뒤에 있을 때 원래 프로토콜 유지)
    map $http_x_forwarded_proto $proxy_x_forwarded_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 4096;

    server {
        listen 80;
        server_name _;

        client_max_body_size 4g;

        # 동적 DNS resolve를 위한 변수 설정
        set $backend_host asr-backend:8000;
        set $frontend_host asr-frontend:3000;
        set $minio_host asr-minio:9000;
        set $grafana_host asr-grafana:3000;
        set $flower_host asr-flower:5555;
        set $tempo_otlp_host asr-tempo:4318;  # Tempo OTLP HTTP (V8.1)
        set $langfuse_host asr-langfuse:3000;  # Langfuse (V8.1)

        location /ws/ {
            proxy_pass http://$backend_host;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # WebSocket 타임아웃 설정
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # 채팅 API 전용 설정 (SSE 스트리밍 최적화)
        location = /api/chat {
            proxy_pass http://$backend_host;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # SSE/스트리밍을 위한 필수 설정
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

            # Chunked transfer encoding 활성화
            chunked_transfer_encoding on;

            # HTTP/2 push 비활성화 (SSE와 충돌 방지)
            http2_push_preload off;
        }

        location /api/ {
            proxy_pass http://$backend_host;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # W3C Trace Context 헤더 전달 (분산 추적 - 프론트엔드~백엔드 연결)
            proxy_set_header traceparent $http_traceparent;
            proxy_set_header tracestate $http_tracestate;

            # SSE/스트리밍을 위한 설정 (채팅 API)
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
        }

        # MinIO 미디어 파일 프록시 (스트리밍)
        location /media/ {
            rewrite ^/media/(.*)$ /asr-media/$1 break;
            proxy_pass http://$minio_host;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Range 요청 지원 (스트리밍에 필수)
            proxy_set_header Range $http_range;
            proxy_set_header If-Range $http_if_range;
            proxy_buffering off;

            # CORS 헤더 추가
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
            add_header Access-Control-Allow-Headers "Range";
            add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges";

            # 캐싱 설정
            proxy_cache_valid 200 206 1h;
            add_header X-Cache-Status $upstream_cache_status;
        }

        # Grafana 블랙리스트 방식: 관리자 페이지만 차단, 나머지는 허용
        location ~ ^/grafana/(login|logout|org|admin|profile|datasources|connections|alerting/admin|plugins/.*/(settings|config)|api/user|api/org|api/admin) {
            return 403;
        }

        # 나머지 모든 Grafana 경로 허용
        location /grafana/ {
            proxy_pass http://$grafana_host;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /grafana;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # iframe 허용
            add_header X-Frame-Options "ALLOWALL";
            add_header Content-Security-Policy "frame-ancestors *";

            # WebSocket 타임아웃
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;

            proxy_cookie_path / "/grafana/";
        }

        # Flower (Celery 모니터링) 프록시 - 읽기 전용
        location /flower/api/ {
            limit_except GET HEAD OPTIONS {
                deny all;
            }
            proxy_pass http://$flower_host;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /flower/ {
            proxy_pass http://$flower_host;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # iframe 허용
            add_header X-Frame-Options "ALLOWALL";
            add_header Content-Security-Policy "frame-ancestors *";

            # WebSocket 타임아웃 (Flower 실시간 업데이트용)
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
        }

        # Jaeger 제거됨 (V8.1: Tempo로 완전 대체)
        # /jaeger/ 경로 접근 시 Grafana Tempo로 리다이렉트
        location /jaeger/ {
            return 301 /grafana/explore?orgId=1&left=%5B%22now-1h%22,%22now%22,%22Tempo%22%5D;
        }

        # Langfuse - LLM Observability (V8.1)
        location /langfuse/ {
            rewrite ^/langfuse/(.*)$ /$1 break;
            proxy_pass http://$langfuse_host;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # iframe 허용
            add_header X-Frame-Options "ALLOWALL";
            add_header Content-Security-Policy "frame-ancestors *";

            # WebSocket 타임아웃
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
        }

        # Tempo OTLP HTTP 엔드포인트 (브라우저 traces 수신)
        location /otlp/ {
            # CORS preflight 처리
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*';
                add_header 'Access-Control-Allow-Methods' 'POST, OPTIONS';
                add_header 'Access-Control-Allow-Headers' 'Content-Type, traceparent, tracestate';
                add_header 'Access-Control-Max-Age' 86400;
                return 204;
            }

            rewrite ^/otlp/(.*)$ /$1 break;
            proxy_pass http://$tempo_otlp_host;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Content-Type $content_type;

            # CORS 헤더 (브라우저에서 직접 전송 허용)
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, traceparent, tracestate' always;
        }

        location / {
            proxy_pass http://$frontend_host;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }

    # 내부 접근 전용 서버 (전체 접근 허용)
    server {
        listen 8080;
        server_name localhost;

        set $grafana_host asr-grafana:3000;

        location /grafana/ {
            proxy_pass http://$grafana_host;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /grafana;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_cookie_path / "/grafana/";
        }
    }
}
