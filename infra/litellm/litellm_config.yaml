model_list:
  # ============================================================
  # CLIProxyAPI 경유 Codex 모델 (OpenAI OAuth)
  # ============================================================
  # - 내부 Docker 네트워크에서 cli-proxy-api:8317 로 직접 연결
  # - CLIPROXY_API_KEY는 infra/cliproxy/config.yaml 의 api-keys 값과 동일해야 함
  - model_name: "codex-high"
    litellm_params:
      model: "openai/gpt-5-codex(high)"
      api_base: "http://cli-proxy-api:8317/v1"
      api_key: "os.environ/CLIPROXY_API_KEY"
      stream: true

  - model_name: "codex-medium"
    litellm_params:
      model: "openai/gpt-5-codex(medium)"
      api_base: "http://cli-proxy-api:8317/v1"
      api_key: "os.environ/CLIPROXY_API_KEY"
      stream: true

  - model_name: "codex-low"
    litellm_params:
      model: "openai/gpt-5-codex(low)"
      api_base: "http://cli-proxy-api:8317/v1"
      api_key: "os.environ/CLIPROXY_API_KEY"
      stream: true

  # ============================================================
  # 동적 라우팅 (와일드카드) - 새 모델 추가 시 config 수정 불필요
  # ============================================================
  # 모든 LLM 모델은 prometheus-router를 통해 동적으로 라우팅됩니다.
  # stream_processor.py가 모델명 패턴을 분석하여 적절한 프로바이더(GPU/NPU)로 전달합니다.
  #
  # 사용 예시:
  #   - model: "lfm2:2.6b" → NPU (flm-llm)
  #   - model: "gpt-oss-sg:20b" → NPU (flm-llm)
  #   - model: "lfm2.5-tk:1.2b" → NPU (flm-llm-thinking)
  #   - model: "llama3:8b" → GPU (llama-server)

  # LLM 와일드카드 - 모든 LLM 모델 동적 라우팅
  - model_name: "*"
    litellm_params:
      model: "prometheus-router/*"
      stream: true

  # ASR Models - V7.4: chat completion 엔드포인트 사용 (OCR과 동일)
  # /v1/chat/completions 엔드포인트를 사용하여 custom provider 지원
  # custom_handler.acompletion()에서 task_type=asr 감지하여 처리
  - model_name: "asr-speed"
    litellm_params:
      model: "prometheus-router/asr-speed"

  - model_name: "asr-accuracy"
    litellm_params:
      model: "prometheus-router/asr-accuracy"

  - model_name: "diarization"
    litellm_params:
      model: "prometheus-router/diarization"

  # OCR Vision Models - V7.0: prometheus-router를 통해 Redis Stream으로 라우팅
  # custom_handler.py가 OCR 요청을 감지하고 Redis Stream을 통해
  # Provider Manager (Host) → GPU/NPU 서버로 전달합니다.
  - model_name: "ocr-speed"
    litellm_params:
      model: "prometheus-router/ocr-speed"

  - model_name: "ocr-accuracy"
    litellm_params:
      model: "prometheus-router/ocr-accuracy"

litellm_settings:
  custom_provider_map:
    - provider: "prometheus-router"
      custom_handler: custom_handler.prometheus_router
  # Retry settings for on-demand servers (서버 시작 대기)
  num_retries: 10
  request_timeout: 600
  # Cooldown 비활성화 (on-demand 서버는 처음에 연결 실패 정상)
  allowed_fails: 10
  cooldown_time: 0

router_settings:
  # Retry policy for connection errors
  retry_policy:
    TimeoutErrorRetries: 5
    RateLimitErrorRetries: 3
    InternalServerErrorRetries: 10

general_settings:
  master_key: "os.environ/LITELLM_API_KEY"
  disable_auth: true
  allow_requests_on_db_unavailable: true
  background_health_checks: False
  health_check_interval: 86400
