global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    monitor: 'asr-monitoring'

scrape_configs:
  # Prometheus 자체 모니터링
  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']

  # FastAPI Backend
  - job_name: 'backend'
    static_configs:
      - targets: ['asr-backend:8000']
    metrics_path: '/metrics'

  # Windows Host (windows_exporter)
  # GPU, NPU, RAM, Disk, CPU 등 모든 시스템 메트릭 수집
  - job_name: 'windows'
    static_configs:
      - targets: ['host.docker.internal:9182']
    metrics_path: '/metrics'

  # NPU Exporter (GPU Compute 엔진을 NPU로 변환/라벨링)
  - job_name: 'npu'
    static_configs:
      - targets: ['host.docker.internal:9183']
    metrics_path: '/metrics'
