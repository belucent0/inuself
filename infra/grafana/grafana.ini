# Grafana 설정 파일 (외부 모니터링 전용 - 읽기 전용)
# https://grafana.com/docs/grafana/latest/setup-grafana/configure-grafana/

[server]
# 서버 루트 URL (서브패스 사용 시 필수 - 외부 접근을 위해 필요)
root_url = https://asr.timblo.io/grafana/
# 서브패스에서 서비스 제공
serve_from_sub_path = true

[security]
# 관리자 사용자명 (내부 관리용)
admin_user = admin
# 관리자 비밀번호 (환경변수 GF_SECURITY_ADMIN_PASSWORD로 설정)
admin_password = ${GF_SECURITY_ADMIN_PASSWORD}
# iframe 임베딩 허용 (외부 모니터링 페이지 임베딩용)
allow_embedding = true
# Gravatar 비활성화 (외부 요청 방지)
disable_gravatar = true

[auth.anonymous]
# 익명 접근 활성화 (외부 사용자)
enabled = true
# 익명 사용자 역할 (Viewer: 읽기 전용)
org_role = Viewer

[users]
# Viewer도 Explore 사용 가능하도록 허용
viewers_can_edit = true

[live]
# Grafana Live 기능 비활성화 (기본값: true, 명시적으로 false 설정 필요)
enabled = false

[alerting]
# 알림 기능 비활성화 (기본값: true, 명시적으로 false 설정 필요)
enabled = false
