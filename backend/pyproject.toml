[tool.poetry]
name = "torch-asr-backend"
version = "0.1.0"
description = "FastAPI backend for ASR + speaker diarization pipeline"
authors = ["AutoGenerated"]
readme = "README.md"
packages = [{include = "app"}]

# package-mode는 Poetry 1.8.0+에서만 지원됨
# Docker에서는 --no-root 플래그 사용, 로컬에서는 poetry install --no-root 사용

[tool.poetry.dependencies]
python = ">=3.12,<3.14"

# ========================================
# API 서버 공통 의존성 (가벼운 것들)
# ========================================
fastapi = "^0.111.0"
uvicorn = "^0.30.0"
python-dotenv = "^1.0.1"
sqlalchemy = "^2.0.29"
asyncpg = "^0.29.0"
psycopg2-binary = "^2.9.9"
alembic = "^1.13.1"
pydantic = "^2.7.0"
pydantic-settings = "^2.3.0"
redis = "^5.0.4"
celery = {extras = ["redis"], version = "^5.3.0"}
python-multipart = "^0.0.9"
tenacity = "^8.2.3"
boto3 = "^1.34.0"
httpx = "^0.27.0"  # LLM 워커와 통신용
openai = "^1.0.0"  # LiteLLM 표준 인터페이스
loguru = "^0.7.0"
pillow = "^10.0.0"  # 이미지 처리 (OCR용)
PyMuPDF = "^1.23.0"  # PDF를 이미지로 변환 (OCR용, 크로스 플랫폼, 의존성 없음)
prometheus-fastapi-instrumentator = "^7.0.0"  # Prometheus 메트릭 수집
yt-dlp = "^2025.12.8"  # YouTube 다운로드

# ========================================
# OpenTelemetry 분산 추적
# ========================================
opentelemetry-api = "^1.27.0"
opentelemetry-sdk = "^1.27.0"
opentelemetry-exporter-otlp = "^1.27.0"
opentelemetry-instrumentation-fastapi = ">=0.48b0"
opentelemetry-instrumentation-redis = ">=0.48b0"
opentelemetry-instrumentation-sqlalchemy = ">=0.48b0"
opentelemetry-instrumentation-httpx = ">=0.48b0"
opentelemetry-instrumentation-celery = ">=0.48b0"

# ========================================
# V6.5: 오디오 처리는 Worker에서만 수행
# librosa, soundfile은 Worker pyproject.toml에만 필요
# ========================================

# V6.5: torch/pyannote는 Worker에서만 사용 (Backend는 LiteLLM Proxy 호출)
yt-dlp-ejs = "^0.3.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-asyncio = "^0.23.6"
# huggingface-hub는 docling이 자동으로 설치하므로 제거 (버전 충돌 방지)

[build-system]
requires = ["poetry-core>=1.5.0"]
build-backend = "poetry.core.masonry.api"


[tool.poetry.scripts]
dev = "app.run:start"
