[tool.poetry]
name = "torch-asr-backend"
version = "0.1.0"
description = "FastAPI backend for ASR + speaker diarization pipeline"
authors = ["AutoGenerated"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"

# ========================================
# API 서버 공통 의존성 (가벼운 것들)
# ========================================
fastapi = "^0.111.0"
uvicorn = "^0.30.0"
python-dotenv = "^1.0.1"
sqlalchemy = "^2.0.29"
asyncpg = "^0.29.0"
psycopg2-binary = "^2.9.9"
alembic = "^1.13.1"
pydantic = "^2.7.0"
pydantic-settings = "^2.3.0"
redis = "^5.0.4"
rq = "^1.15.1"  # 기존 RQ (deprecated, 추후 제거 예정)
celery = {extras = ["redis"], version = "^5.3.0"}
python-multipart = "^0.0.9"
tenacity = "^8.2.3"
boto3 = "^1.34.0"
httpx = "^0.27.0"  # LLM 워커와 통신용
loguru = "^0.7.0"
pillow = "^10.0.0"  # 이미지 처리 (OCR용)
PyMuPDF = "^1.23.0"  # PDF를 이미지로 변환 (OCR용, 크로스 플랫폼, 의존성 없음)
pdf2image = {version = "^1.16.3", optional = true}  # PDF를 이미지로 변환 (하위 호환성, poppler 필요)

# ========================================
# 오디오 처리 공통 의존성 (API/워커 공통)
# ========================================
librosa = "^0.10.0"
soundfile = "^0.12.0"

# ========================================
# GPU 워커 전용 의존성 (무거운 것들)
# optional = true로 설정하여 선택적 설치
# ========================================
torch = {version = "*", optional = true}
"pyannote.audio" = {version = "^3.1.0", optional = true}
llama-cpp-python = {version = "^0.2.80", optional = true}

[tool.poetry.extras]
# GPU 워커용 extras 그룹
# 설치: poetry install --extras gpu_worker
gpu_worker = ["torch", "pyannote.audio", "llama-cpp-python"]

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-asyncio = "^0.23.6"
huggingface-hub = "^1.1.6"

[build-system]
requires = ["poetry-core>=1.5.0"]
build-backend = "poetry.core.masonry.api"

