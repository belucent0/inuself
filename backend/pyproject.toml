[project]
name = "torch-asr-backend"
version = "0.1.0"
description = "FastAPI backend for ASR + speaker diarization pipeline"
readme = "README.md"
requires-python = ">=3.12,<3.14"

dependencies = [
    # ========================================
    # API 서버 공통 의존성 (가벼운 것들)
    # ========================================
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "python-dotenv>=1.0.1",
    "sqlalchemy>=2.0.29",
    "asyncpg>=0.31.0",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.1",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "redis>=5.0.4",
    "celery[redis]>=5.3.0",
    "python-multipart>=0.0.9",
    "tenacity>=8.2.3",
    "minio>=7.2.0",
    "httpx>=0.27.0",
    "openai>=1.0.0",

    # ========================================
    # AI Agent Framework (V8.0)
    # ========================================
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "kiwipiepy>=0.22.0",
    "loguru>=0.7.0",
    "pillow>=10.0.0",
    "pymupdf>=1.23.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "yt-dlp>=2025.12.8",
    "curl-cffi>=0.10.0,<0.14.0",
    "yt-dlp-ejs>=0.3.2",

    # ========================================
    # OpenTelemetry 분산 추적
    # ========================================
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-redis>=0.48b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.48b0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
    "opentelemetry-instrumentation-celery>=0.48b0",

    # ========================================
    # LLM Observability
    # ========================================
    "traceloop-sdk>=0.33.0",  # OpenLLMetry
    "langfuse>=2.0.0,<3.0.0", # Semantic Observability (v2 API)
    "pgvector (>=0.4.2,<0.5.0)",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.6",
]

[project.scripts]
dev = "app.run:start"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
