[tool.poetry]
name = "torch-asr-backend"
version = "0.1.0"
description = "FastAPI backend for ASR + speaker diarization pipeline"
authors = ["AutoGenerated"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.111.0"
uvicorn = "^0.30.0"
python-dotenv = "^1.0.1"
sqlalchemy = "^2.0.29"
asyncpg = "^0.29.0"
psycopg2-binary = "^2.9.9"
alembic = "^1.13.1"
pydantic = "^2.7.0"
pydantic-settings = "^2.3.0"
redis = "^5.0.4"
rq = "^1.15.1"
python-multipart = "^0.0.9"
tenacity = "^8.2.3"
boto3 = "^1.34.0"
librosa = "^0.10.0"
soundfile = "^0.12.0"
"pyannote.audio" = "^3.1.0"
torch = {version = "*", optional = true}
llama-cpp-python = "^0.2.80"
httpx = "^0.27.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-asyncio = "^0.23.6"

[build-system]
requires = ["poetry-core>=1.5.0"]
build-backend = "poetry.core.masonry.api"

