[tool.poetry]
name = "torch-asr-backend"
version = "0.1.0"
description = "FastAPI backend for ASR + speaker diarization pipeline"
authors = ["AutoGenerated"]
readme = "README.md"
packages = [{include = "app"}]

# package-mode는 Poetry 1.8.0+에서만 지원됨
# Docker에서는 --no-root 플래그 사용, 로컬에서는 poetry install --no-root 사용

[tool.poetry.dependencies]
python = ">=3.12,<3.14"

# ========================================
# API 서버 공통 의존성 (가벼운 것들)
# ========================================
fastapi = "^0.111.0"
uvicorn = "^0.30.0"
python-dotenv = "^1.0.1"
sqlalchemy = "^2.0.29"
asyncpg = "^0.29.0"
psycopg2-binary = "^2.9.9"
alembic = "^1.13.1"
pydantic = "^2.7.0"
pydantic-settings = "^2.3.0"
redis = "^5.0.4"
rq = "^1.15.1"  # 기존 RQ (deprecated, 추후 제거 예정)
celery = {extras = ["redis"], version = "^5.3.0"}
python-multipart = "^0.0.9"
tenacity = "^8.2.3"
boto3 = "^1.34.0"
httpx = "^0.27.0"  # LLM 워커와 통신용
loguru = "^0.7.0"
pillow = "^10.0.0"  # 이미지 처리 (OCR용)
PyMuPDF = "^1.23.0"  # PDF를 이미지로 변환 (OCR용, 크로스 플랫폼, 의존성 없음)
prometheus-fastapi-instrumentator = "^7.0.0"  # Prometheus 메트릭 수집

# ========================================
# 오디오 처리 공통 의존성 (API/워커 공통)
# ========================================
librosa = "^0.10.0"
soundfile = ">=0.13.1"  # pyannote.audio 4.x requires >=0.13.1

# ========================================
# 워커별 선택적 의존성 (무거운 것들)
# optional = true로 설정하여 선택적 설치
# ========================================
torch = {version = "*", optional = true}  # ASR 워커용 (기존 설치된 ROCm 버전 사용)
"pyannote.audio" = {version = "4.0.3", optional = true}  # ASR 워커용 (community-1 모델 필수)

[tool.poetry.extras]
# 워커별 extras 그룹
# ASR 워커: poetry install --extras asr_worker
asr_worker = ["torch", "pyannote.audio"]
# LLM 워커: poetry install --extras llm_worker
# llama-server를 서브프로세스로 관리하므로 추가 패키지 불필요
llm_worker = []
# 전체 워커 (하위 호환성): poetry install --extras gpu_worker  
gpu_worker = ["torch", "pyannote.audio"]

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-asyncio = "^0.23.6"
# huggingface-hub는 docling이 자동으로 설치하므로 제거 (버전 충돌 방지)

[build-system]
requires = ["poetry-core>=1.5.0"]
build-backend = "poetry.core.masonry.api"


[tool.poetry.scripts]
dev = "app.run:start"
