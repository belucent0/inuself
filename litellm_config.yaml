model_list:
  # Prometheus 기반 라우팅 모델 (Chat)
  - model_name: "qwen3-4b"
    litellm_params:
      model: "prometheus-router/qwen3-4b"
      stream: true

  # Audio Models - V6.6: prometheus-router를 통해 Redis Stream으로 라우팅
  # custom_handler.py의 transcription 메서드가 Redis Stream을 사용하여
  # Provider Manager (Host)로 요청을 전달합니다.
  - model_name: "flm-audio"
    litellm_params:
      model: "prometheus-router/flm-audio"

  - model_name: "whisper-large-v3"
    litellm_params:
      model: "prometheus-router/whisper-large-v3"

  - model_name: "whisper-turbo"
    litellm_params:
      model: "prometheus-router/whisper-turbo"

  - model_name: "pyannote"
    litellm_params:
      model: "prometheus-router/pyannote"

  # OCR Vision Models - V7.0: prometheus-router를 통해 Redis Stream으로 라우팅
  # custom_handler.py가 OCR 요청을 감지하고 Redis Stream을 통해
  # Provider Manager (Host) → GPU/NPU 서버로 전달합니다.
  - model_name: "ocr-speed"
    litellm_params:
      model: "prometheus-router/ocr-speed"

  - model_name: "ocr-accuracy"
    litellm_params:
      model: "prometheus-router/ocr-accuracy"

litellm_settings:
  custom_provider_map:
    - provider: "prometheus-router"
      custom_handler: custom.custom_handler.prometheus_router
  # Retry settings for on-demand servers (서버 시작 대기)
  num_retries: 10
  request_timeout: 600
  # Cooldown 비활성화 (on-demand 서버는 처음에 연결 실패 정상)
  allowed_fails: 10
  cooldown_time: 0

router_settings:
  # Retry policy for connection errors
  retry_policy:
    TimeoutErrorRetries: 5
    RateLimitErrorRetries: 3
    InternalServerErrorRetries: 10

general_settings:
  master_key: "os.environ/LITELLM_API_KEY"
  background_health_checks: False
  health_check_interval: 86400
