model_list:
  # Prometheus 기반 라우팅 모델 (Chat)
  - model_name: "qwen3-4b"
    litellm_params:
      model: "prometheus-router/qwen3-4b"
      stream: true

  # Audio Models - OpenAI 호환 모드로 직접 연결
  # LiteLLM transcription은 커스텀 프로바이더 미지원, OpenAI 호환으로 우회
  # NOTE: 각 Audio Gateway 서버는 OpenAI-compatible /v1/audio/transcriptions 엔드포인트 제공
  - model_name: "flm-audio"
    litellm_params:
      model: "openai/flm-audio"
      api_base: "http://host.docker.internal:11434/v1"
      api_key: "dummy-key"

  - model_name: "whisper-large-v3"
    litellm_params:
      model: "openai/whisper-large-v3"
      api_base: "http://host.docker.internal:8002/v1"
      api_key: "dummy-key"

  - model_name: "whisper-turbo"
    litellm_params:
      model: "openai/whisper-turbo"
      api_base: "http://host.docker.internal:8001/v1"
      api_key: "dummy-key"

  - model_name: "pyannote"
    litellm_params:
      model: "openai/pyannote"
      api_base: "http://host.docker.internal:8003/v1"
      api_key: "dummy-key"

litellm_settings:
  custom_provider_map:
    - provider: "prometheus-router"
      custom_handler: custom.custom_handler.prometheus_router
  # Retry settings for on-demand servers (서버 시작 대기)
  num_retries: 10
  request_timeout: 600
  # Cooldown 비활성화 (on-demand 서버는 처음에 연결 실패 정상)
  allowed_fails: 10
  cooldown_time: 0

router_settings:
  # Retry policy for connection errors
  retry_policy:
    TimeoutErrorRetries: 5
    RateLimitErrorRetries: 3
    InternalServerErrorRetries: 10

general_settings:
  master_key: "sk-litellm-master"
  background_health_checks: False
  health_check_interval: 86400
