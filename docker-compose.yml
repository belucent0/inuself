services:

  minio:
    image: minio/minio:latest
    container_name: asr-minio
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: torchdev
      MINIO_ROOT_PASSWORD: torchdev-secret
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # MinIO Console
    volumes:
      - minio-data:/data

  redis:
    image: redis:7.2-alpine
    container_name: asr-redis
    command: [ "redis-server", "/usr/local/etc/redis/redis.conf" ]
    volumes:
      - redis-data:/data
      - ./infra/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:18.1
    container_name: asr-postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: asr
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user -d asr" ]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:1.25-alpine
    container_name: asr-nginx
    ports:
      - "80:80"
      # - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: asr-backend:1.0.0
    container_name: asr-backend
    ports:
      - "8000:8000"
    volumes:
      - ./.env:/app/.env:ro
      - ./backend/data:/app/data
      # 코드 변경사항 실시간 반영 (개발 환경)
      - ./backend/app:/app/app:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      litellm:
        condition: service_healthy
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - TASK_QUEUE_TYPE=celery
      - DATABASE_URL=postgresql+asyncpg://user:pass@asr-postgres:5432/asr
      - REDIS_URL=redis://asr-redis:6379/0
      - S3_ENDPOINT=http://asr-minio:9000
      - S3_ACCESS_KEY=torchdev
      - S3_SECRET_KEY=torchdev-secret
      - S3_BUCKET_NAME=asr-media
      # LiteLLM 프록시 설정
      - LLM_PROVIDER=litellm
      - LITELLM_BASE_URL=http://asr-litellm:4000
      - LITELLM_API_KEY=sk-litellm-master
      - LITELLM_MODEL=qwen3-4b
      # 기존 FLM 설정 (호환성)
      - FLM_BASE_URL=${FLM_BASE_URL:-http://host.docker.internal:11434}
      - FLM_LLM_MODEL=${FLM_LLM_MODEL:-qwen3-it:4b}
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_ADMIN_USERNAME=${NEXT_PUBLIC_ADMIN_USERNAME}
        - NEXT_PUBLIC_ADMIN_PASSWORD=${NEXT_PUBLIC_ADMIN_PASSWORD}
    container_name: asr-frontend
    ports:
      - "3000:3000"
    environment:
      API_BASE_URL: http://asr-backend:8000/api
      NEXT_PUBLIC_GRAFANA_DASHBOARD_URL: ${NEXT_PUBLIC_GRAFANA_DASHBOARD_URL:-}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: asr-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: asr-grafana
    ports:
      - "3002:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./infra/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./infra/grafana/provisioning/dashboards/dashboard.yml:/etc/grafana/provisioning/dashboards/dashboard.yml:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: asr-litellm
    command: [ "--config", "/app/config.yaml", "--port", "4000" ]
    ports:
      - "4000:4000"
    volumes:
      - ./litellm_config.yaml:/app/config.yaml:ro
      - ./infra/litellm:/app/custom:ro
    environment:
      - PROMETHEUS_URL=http://asr-prometheus:9090
      - REDIS_URL=redis://asr-redis:6379/0
      - GPU_DEVICE_ID=0x000142B6
      - NPU_DEVICE_ID=0x000160E6
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - prometheus
      - redis
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:4000/health" ]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  redis-data:
  minio-data:
  postgres-data:
  prometheus-data:
  grafana-data:
