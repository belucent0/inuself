services:

  minio:
    image: minio/minio:latest
    container_name: asr-minio
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: torchdev
      MINIO_ROOT_PASSWORD: torchdev-secret
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # MinIO Console
    volumes:
      - minio-data:/data
    # MinIO Client(mc)와 alias 설정 예시:
    #   docker run --rm --network host minio/mc \
    #     alias set local http://127.0.0.1:9000 torchdev torchdev-secret

  minio-bootstrap:
    image: minio/mc:latest
    container_name: asr-minio-bootstrap
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MC_HOST_local: http://torchdev:torchdev-secret@asr-minio:9000
    command: ["mb", "--ignore-existing", "local/asr-media"]
    restart: "no"

  minio-policy-setup:
    image: minio/mc:latest
    container_name: asr-minio-policy-setup
    depends_on:
      minio-bootstrap:
        condition: service_completed_successfully
    environment:
      MC_HOST_local: http://torchdev:torchdev-secret@asr-minio:9000
    entrypoint: /bin/sh
    command: -c "mc anonymous set download local/asr-media"
    restart: "no"


  redis:
    image: redis:7.2-alpine
    container_name: asr-redis
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - redis-data:/data
      - ./infra/redis.conf:/usr/local/etc/redis/redis.conf:ro
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-insight:
    image: redis/redisinsight:latest
    container_name: asr-redis-insight
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "5540:5540"
    volumes:
      - redis-insight-data:/data
    restart: unless-stopped

  postgres:
    image: postgres:18.1
    container_name: asr-postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: asr
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d asr"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:1.25-alpine
    container_name: asr-nginx
    ports:
      - "80:80"
      # - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: asr-backend:1.0.0
    container_name: asr-backend
    ports:
      - "8000:8000"
    volumes:
      - ./.env:/app/.env:ro
      - ./backend/data:/app/data
      # Windows 호스트의 PM2 워커 시작 트리거 파일 공유
      - ./backend/data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    environment:
      - TASK_QUEUE_TYPE=celery
      - DATABASE_URL=postgresql+asyncpg://user:pass@asr-postgres:5432/asr
      - REDIS_URL=redis://asr-redis:6379/0
      - S3_ENDPOINT=http://asr-minio:9000
      - S3_ACCESS_KEY=torchdev
      - S3_SECRET_KEY=torchdev-secret
      - S3_BUCKET_NAME=asr-media
      - MEDIA_BASE_URL=/media
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_ADMIN_USERNAME=${NEXT_PUBLIC_ADMIN_USERNAME}
        - NEXT_PUBLIC_ADMIN_PASSWORD=${NEXT_PUBLIC_ADMIN_PASSWORD}
        - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL}
    container_name: asr-frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis-data:
  redis-insight-data:
  minio-data:
  postgres-data: