services:

  minio:
    image: minio/minio:latest
    container_name: asr-minio
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: torchdev
      MINIO_ROOT_PASSWORD: torchdev-secret
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # MinIO Console
    volumes:
      - minio-data:/data
    # MinIO Client(mc)와 alias 설정 예시:
    #   docker run --rm --network host minio/mc \
    #     alias set local http://127.0.0.1:9000 torchdev torchdev-secret

  minio-bootstrap:
    image: minio/mc:latest
    container_name: asr-minio-bootstrap
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MC_HOST_local: http://torchdev:torchdev-secret@asr-minio:9000
    command: ["mb", "--ignore-existing", "local/asr-media"]
    restart: "no"


  redis:
    image: redis:7.2-alpine
    container_name: asr-redis
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - redis-data:/data
      - ./infra/redis.conf:/usr/local/etc/redis/redis.conf:ro
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-insight:
    image: redis/redisinsight:latest
    container_name: asr-redis-insight
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "5540:5540"
    volumes:
      - redis-insight-data:/data
    restart: unless-stopped

  postgres:
    image: postgres:18.1
    container_name: asr-postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: asr
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d asr"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis-data:
  redis-insight-data:
  minio-data:
  postgres-data: