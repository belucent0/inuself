services:

  minio:
    image: minio/minio:latest
    container_name: asr-minio
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-torchdev}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-changeme}
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # MinIO Console
    volumes:
      - minio-data:/data

  valkey:
    image: valkey/valkey:9-alpine
    container_name: asr-valkey
    command: [ "valkey-server", "/usr/local/etc/redis/redis.conf" ]
    volumes:
      - redis-data:/data
      - ./infra/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "valkey-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:18.1
    container_name: asr-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-asr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-asr}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-asr} -d $${POSTGRES_DB:-asr}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:1.25-alpine
    container_name: asr-nginx
    ports:
      - "80:80"
      - "127.0.0.1:8080:8080" # 내부 Grafana 관리용 (로컬에서만 접근)
      # - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: asr-backend:latest
    container_name: asr-backend
    ports:
      - "8000:8000"
    volumes:
      - ./.env:/app/.env:ro
      - ./backend/data:/app/data
      # 코드 변경사항 실시간 반영 (개발 환경)
      - ./backend/app:/app/app:ro
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      minio:
        condition: service_healthy
      litellm:
        condition: service_healthy
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - TASK_QUEUE_TYPE=celery
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-asr}:${POSTGRES_PASSWORD:-changeme}@asr-postgres:5432/${POSTGRES_DB:-asr}
      - REDIS_URL=redis://asr-valkey:6379/0
      - S3_ENDPOINT=http://asr-minio:9000
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-torchdev}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-changeme}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-asr-media}
      # LiteLLM 프록시 설정
      - LLM_PROVIDER=litellm
      - LITELLM_BASE_URL=http://litellm:4000
      - LITELLM_API_KEY=${LITELLM_API_KEY}
      - LITELLM_MODEL=${LITELLM_MODEL:-qwen3-4b}
      # OpenTelemetry 분산 추적
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - OTEL_SERVICE_NAME=asr-backend
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_METRICS_EXPORTER=none
      - OTEL_LOGS_EXPORTER=none
      # FLM Model Configuration (Backend용 - 검색 요약)
      - FLM_LLM_MODEL=${FLM_LLM_MODEL:-lfm2:2.6b}
      - FLM_THINKING_MODEL=${FLM_THINKING_MODEL:-lfm2.5-tk:1.2b}
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_ADMIN_USERNAME=${NEXT_PUBLIC_ADMIN_USERNAME}
        - NEXT_PUBLIC_ADMIN_PASSWORD=${NEXT_PUBLIC_ADMIN_PASSWORD}
    container_name: asr-frontend
    ports:
      - "3000:3000"
    environment:
      API_BASE_URL: http://asr-backend:8000/api
      NEXT_PUBLIC_GRAFANA_DASHBOARD_URL: ${NEXT_PUBLIC_GRAFANA_DASHBOARD_URL:-}
      NEXT_PUBLIC_FLOWER_URL: ${NEXT_PUBLIC_FLOWER_URL:-}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: asr-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: asr-grafana
    ports:
      - "3002:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./infra/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./infra/grafana/provisioning/dashboards/dashboard.yml:/etc/grafana/provisioning/dashboards/dashboard.yml:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - jaeger
    restart: unless-stopped

  # Jaeger - 분산 추적 (OpenTelemetry 백엔드)
  # Jaeger 2.x는 YAML 설정 파일 사용 (환경변수 미지원)
  jaeger:
    image: jaegertracing/jaeger:2.14.1
    container_name: asr-jaeger
    command: [ "--config", "/etc/jaeger/config.yaml" ]
    ports:
      - "16686:16686" # Jaeger UI
      - "4317:4317" # OTLP gRPC (traces)
      - "4318:4318" # OTLP HTTP (traces)
      - "9411:9411" # Zipkin compatible
      - "13133:13133" # Health check
    volumes:
      - ./infra/jaeger/config.yaml:/etc/jaeger/config.yaml:ro
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:13133/status" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    image: asr-worker:latest
    container_name: asr-worker-unified
    command: celery -A worker.celery_app worker --loglevel=info -Q celery,asr,asr_tasks,llm_summary,ocr_tasks,search
    volumes:
      - ./.env:/app/.env:ro
      - ./backend/data:/app/data
      - ./backend/app:/app/app:ro
      - ./worker:/app/worker
      - ./infra/litellm:/app/infra/litellm:ro # V6.6: GPU Stream Client
    environment:
      - TASK_QUEUE_TYPE=celery
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-asr}:${POSTGRES_PASSWORD:-changeme}@asr-postgres:5432/${POSTGRES_DB:-asr}
      - REDIS_URL=redis://asr-valkey:6379/0
      - S3_ENDPOINT=http://asr-minio:9000
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-torchdev}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-changeme}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-asr-media}
      # Architecture V7.0: Redis Stream을 통해 Host의 Provider Manager로 요청
      # Worker → Redis Stream → Provider Manager (Host) → GPU/NPU 서버
      # host.docker.internal HTTP 통신 제거 (Docker Desktop 크래시 방지)
      - REDIS_STREAM_ENABLED=true
      # Prometheus for metrics (optional)
      - PROMETHEUS_URL=http://asr-prometheus:9090
      # LiteLLM 프록시 설정 (LLM 요약용)
      - LITELLM_BASE_URL=http://litellm:4000
      - LITELLM_API_KEY=${LITELLM_API_KEY}
      - LITELLM_MODEL=${LITELLM_MODEL:-qwen3-4b}
      # OpenTelemetry 분산 추적
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - OTEL_SERVICE_NAME=asr-worker
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_METRICS_EXPORTER=none
      - OTEL_LOGS_EXPORTER=none
      # Note: Worker는 FLM 모델 환경변수 사용 안 함 (Backend에서만 사용)
    depends_on:
      valkey:
        condition: service_healthy
      postgres:
        condition: service_healthy
      jaeger:
        condition: service_healthy
    restart: unless-stopped

  litellm:
    build:
      context: ./infra/litellm
      dockerfile: Dockerfile
    image: asr-litellm-proxy:1.0.0
    container_name: asr-litellm-proxy
    ports:
      - "4000:4000"
    volumes:
      # config.yaml은 이미지에 포함됨 (볼륨 마운트 제거 - Windows 동기화 문제 방지)
      - ./infra/litellm:/app/custom:ro
    env_file:
      - .env
    environment:
      # Docker 전용 오버라이드 (호스트와 다른 설정)
      - PROMETHEUS_URL=http://asr-prometheus:9090
      - REDIS_URL=redis://asr-valkey:6379/0
      - LITELLM_CONFIG_PATH=/app/custom/litellm_config.yaml
      # LiteLLM은 DB 사용 안 함 (Prisma 에러 방지)
      - DATABASE_URL=
      # Architecture V7.0: Redis Stream을 통해 Host의 Provider Manager로 요청
      # host.docker.internal HTTP 통신 제거 (Docker Desktop 크래시 방지)
      - REDIS_STREAM_ENABLED=true
      # Background health checks 비활성화
      - DISABLE_SPEND_LOGS=true
      - BACKGROUND_HEALTH_CHECKS=false
      - HEALTH_CHECK_INTERVAL=86400
      # OpenTelemetry 분산 추적
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - OTEL_SERVICE_NAME=asr-litellm
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_METRICS_EXPORTER=none
      - OTEL_LOGS_EXPORTER=none
    depends_on:
      - prometheus
      - valkey
      - jaeger
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:4000/health/liveliness" ]
      interval: 30s
      timeout: 10s
      retries: 3

  flower:
    image: mher/flower:2.0
    container_name: asr-flower
    command: celery --broker=redis://asr-valkey:6379/0 flower --port=5555 --url_prefix=flower --read_only=true
    ports:
      - "5555:5555"
    environment:
      - CELERY_BROKER_URL=redis://asr-valkey:6379/0
    depends_on:
      valkey:
        condition: service_healthy
    restart: unless-stopped

  # SearXNG - Deep Search용 메타 검색 엔진
  searxng:
    image: searxng/searxng:latest
    container_name: asr-searxng
    volumes:
      - ./infra/searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080/
      - SEARXNG_SECRET=${SEARXNG_SECRET:-changeme-generate-secret}
    depends_on:
      valkey:
        condition: service_healthy
    restart: unless-stopped
    # 외부 노출 허용 (개발 환경: Host에서 접근 필요)
    ports:
      - "8888:8080"

volumes:
  redis-data:
  minio-data:
  postgres-data:
  prometheus-data:
  grafana-data:
