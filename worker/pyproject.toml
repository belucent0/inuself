[tool.poetry]
name = "torch-asr-worker"
version = "0.1.0"
description = "Celery Worker for ASR pipeline (Architecture V5: API-based, no GPU dependencies)"
authors = ["AutoGenerated"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<3.14"

# ========================================
# Celery 및 메시지 브로커
# ========================================
celery = {extras = ["redis"], version = "^5.3.0"}
redis = "^5.0.4"

# ========================================
# 스토리지 및 HTTP
# ========================================
minio = "^7.2.0"
httpx = "^0.27.0"
openai = "^1.0.0"  # LiteLLM 표준 인터페이스

# ========================================
# 로깅 및 유틸리티
# ========================================
loguru = "^0.7.0"
python-dotenv = "^1.0.1"
pydantic = "^2.7.0"
pydantic-settings = "^2.3.0"
tenacity = "^8.2.3"

# ========================================
# 오디오 처리: ffmpeg만 사용 (librosa/soundfile 제거)
# ========================================
# librosa, soundfile 제거: ~500MB+ 절약
# ffmpeg/ffprobe로 대체 (Dockerfile에 설치됨)

# ========================================
# Architecture V5: GPU/딥러닝 의존성 제거
# - torch, pyannote.audio는 Host의 GPU 서버에서 실행
# - Worker는 LiteLLM API 호출만 담당
# ========================================

# ========================================
# OCR 관련 (선택적)
# ========================================
pillow = "^10.0.0"
PyMuPDF = "^1.23.0"

# ========================================
# DB 접근 (워커에서 결과 저장용)
# ========================================
sqlalchemy = "^2.0.29"
asyncpg = "^0.29.0"
psycopg2-binary = "^2.9.9"

# ========================================
# OpenTelemetry 분산 추적 (HTTP exporter로 grpcio 제거)
# ========================================
opentelemetry-api = "^1.27.0"
opentelemetry-sdk = "^1.27.0"
opentelemetry-exporter-otlp-proto-http = "^1.27.0"
opentelemetry-instrumentation-celery = ">=0.48b0"
opentelemetry-instrumentation-redis = ">=0.48b0"
opentelemetry-instrumentation-httpx = ">=0.48b0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-asyncio = "^0.23.6"

[build-system]
requires = ["poetry-core>=1.5.0"]
build-backend = "poetry.core.masonry.api"
