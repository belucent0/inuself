[tool.poetry]
name = "torch-asr-worker"
version = "0.1.0"
description = "GPU Worker for ASR + speaker diarization pipeline"
authors = ["AutoGenerated"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<3.14"

# ========================================
# Celery 및 메시지 브로커
# ========================================
celery = {extras = ["redis"], version = "^5.3.0"}
redis = "^5.0.4"

# ========================================
# 스토리지 및 HTTP
# ========================================
boto3 = "^1.34.0"
httpx = "^0.27.0"

# ========================================
# 로깅 및 유틸리티
# ========================================
loguru = "^0.7.0"
python-dotenv = "^1.0.1"
pydantic = "^2.7.0"
pydantic-settings = "^2.3.0"
tenacity = "^8.2.3"

# ========================================
# 오디오 처리
# ========================================
librosa = "^0.10.0"
soundfile = ">=0.13.1"

# ========================================
# GPU/딥러닝 의존성
# ========================================
torch = "*"  # 시스템에 설치된 ROCm 버전 사용
"pyannote.audio" = "4.0.3"

# ========================================
# OCR 관련 (선택적)
# ========================================
pillow = "^10.0.0"
PyMuPDF = "^1.23.0"

# ========================================
# DB 접근 (워커에서 결과 저장용)
# ========================================
sqlalchemy = "^2.0.29"
asyncpg = "^0.29.0"
psycopg2-binary = "^2.9.9"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-asyncio = "^0.23.6"

[build-system]
requires = ["poetry-core>=1.5.0"]
build-backend = "poetry.core.masonry.api"
