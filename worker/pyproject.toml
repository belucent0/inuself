[project]
name = "torch-asr-worker"
version = "0.1.0"
description = "Celery Worker for ASR pipeline (Architecture V5: API-based, no GPU dependencies)"
readme = "README.md"
requires-python = ">=3.12,<3.14"

dependencies = [
    # ========================================
    # Celery 및 메시지 브로커
    # ========================================
    "celery[redis]>=5.3.0",
    "redis>=5.0.4",

    # ========================================
    # 스토리지 및 HTTP
    # ========================================
    "minio>=7.2.0",
    "httpx>=0.27.0",
    "openai>=1.0.0",

    # ========================================
    # 로깅 및 유틸리티
    # ========================================
    "loguru>=0.7.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "tenacity>=8.2.3",

    # ========================================
    # OCR 관련 (선택적)
    # ========================================
    "pillow>=10.0.0",
    "pymupdf>=1.23.0",
    "markitdown[docx]>=0.0.1",
    "markdown>=3.5.0",

    # ========================================
    # DB 접근 (워커에서 결과 저장용)
    # ========================================
    "sqlalchemy>=2.0.29",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",

    # ========================================
    # OpenTelemetry 분산 추적
    # ========================================
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27.0",
    "opentelemetry-instrumentation-celery>=0.48b0",
    "opentelemetry-instrumentation-redis>=0.48b0",
    "opentelemetry-instrumentation-httpx>=0.48b0",

    # ========================================
    # LLM Observability (OpenLLMetry)
    # ========================================
    "traceloop-sdk>=0.33.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
