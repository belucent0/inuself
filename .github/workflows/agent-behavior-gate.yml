name: Agent Behavior Gate

# PR 머지 전 LangGraph 에이전트 라우팅 로직 회귀를 차단합니다.
# - 실제 LLM 호출 없음 (kiwipiepy mock 포함)
# - 라이브 서버 불필요 (완전 오프라인)
# - 소요 시간: ~60초

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agent-behavior:
    name: 에이전트 라우팅 & 맥락 처리 검증
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            pytest>=8.2.0 \
            pytest-asyncio>=0.23.6 \
            pydantic>=2.7.0 \
            langchain-core>=0.3.0 \
            langgraph>=0.2.0 \
            loguru>=0.7.0 \
            openai>=1.0.0 \
            httpx>=0.27.0

      - name: Run agent behavior unit tests
        run: |
          python -m pytest tests/unit/agents/ -v --tb=short

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: agent-behavior-${{ github.run_id }}
          path: .pytest_cache/
          retention-days: 7
          if-no-files-found: ignore
