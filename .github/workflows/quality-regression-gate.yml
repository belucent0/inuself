name: Quality Regression Gate

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  workflow_dispatch:

# vLLM(ai-llm) 공유 자원이라 LLM-eval 워크플로를 같은 group으로 직렬화.
concurrency:
  group: vllm-shared
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  quality-regression:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install minimal dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pydantic

      - name: Run SearchQuality smoke validation
        run: python scripts/validate_search_quality_v10.py

      - name: Generate candidate quality report
        run: |
          mkdir -p quality_test_reports/ci
          python scripts/generate_search_quality_report.py \
            --cases .ci/quality/fixtures/search_quality_cases.json \
            --output quality_test_reports/ci/search_quality_candidate.json

      - name: Run regression gate
        run: |
          python scripts/quality_regression_gate.py \
            --baseline .ci/quality/baseline/search_quality_baseline.json \
            --candidate quality_test_reports/ci/search_quality_candidate.json \
            --thresholds .ci/quality/gate_thresholds.json \
            --summary-path quality_test_reports/ci/quality_gate_summary.md

      - name: Upload quality artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quality-regression-${{ github.run_id }}
          path: quality_test_reports/ci/*
          retention-days: 14
