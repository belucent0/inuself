name: Langfuse Eval Gate

# PR 머지 전 실제 서버에서 멀티턴 채팅 품질을 검증합니다.
# self-hosted runner (WSL)에서 실행
# WSL2에서 localhost:8000 SSE 스트리밍이 중단되는 문제를 우회하기 위해
# Windows 호스트 IP를 직접 사용합니다.
# 소요 시간: ~60초 (3-turn 대화)

on:
  pull_request:
    branches:
      - main
      - develop
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  workflow_dispatch:

# vLLM(ai-llm)이 공유 자원이라 모든 LLM-eval 워크플로를 같은 group으로 묶어 직렬화.
# 동시 실행 시 max_num_seqs=3 한도로 인해 큐 폭주 발생.
concurrency:
  group: vllm-shared
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  langfuse-eval:
    name: 멀티턴 채팅 품질 검증 (Langfuse)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Windows 호스트 IP 확인 (WSL2 SSE 스트리밍 우회)
        run: |
          # WSL2에서 localhost 경유 SSE 스트리밍이 끊기는 문제를 우회
          # /etc/resolv.conf의 nameserver가 Windows 호스트 IP
          WIN_IP=$(awk '/nameserver/{print $2; exit}' /etc/resolv.conf)
          if [[ -z "$WIN_IP" ]]; then
            echo "ERROR: Windows 호스트 IP를 추출할 수 없습니다 (WSL2 환경인지 확인 필요)"
            cat /etc/resolv.conf
            exit 1
          fi
          echo "WIN_IP=${WIN_IP}" >> $GITHUB_ENV
          echo "Windows 호스트 IP: ${WIN_IP}"

      - name: 백엔드 헬스 체크
        run: |
          for i in 1 2 3; do
            HTTP_CODE=$(curl -w "%{http_code}" -s -o /tmp/health_response.txt http://${WIN_IP}:8000/health)
            if [ "$HTTP_CODE" = "200" ]; then
              echo "헬스 체크 성공 (${WIN_IP}:8000)"
              exit 0
            fi
            echo "시도 $i/3 실패 (HTTP ${HTTP_CODE}): $(cat /tmp/health_response.txt)"
            [ $i -lt 3 ] && sleep 3
          done
          echo "백엔드가 응답하지 않습니다: http://${WIN_IP}:8000"
          exit 1

      - name: Python 의존성 설치 (영구 venv 캐시)
        # self-hosted runner 환경에서 매 실행마다 venv 새로 생성 + PyPI 다운로드 시
        # pip install이 비정상적으로 느려져 timeout 발생 (직접 WSL에서는 18초인데 CI는 3분+).
        # ~/cache/eval-venv에 영구 venv를 두고 첫 실행만 install, 이후는 symlink로 재사용.
        run: |
          CACHE_VENV="$HOME/cache/eval-venv"
          if [ ! -x "$CACHE_VENV/bin/python" ]; then
            mkdir -p "$HOME/cache"
            python3 -m venv "$CACHE_VENV"
            "$CACHE_VENV/bin/pip" install --quiet \
              "langfuse>=2.0.0,<3.0.0" \
              "httpx>=0.27.0" \
              "pydantic>=2.0.0"
          fi
          ln -sfn "$CACHE_VENV" .eval-venv
          .eval-venv/bin/python -c "import langfuse, httpx, pydantic; print('OK', langfuse.__version__)"

      - name: Langfuse 데이터셋 동기화
        env:
          LANGFUSE_HOST: ${{ secrets.LANGFUSE_HOST }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
        run: .eval-venv/bin/python scripts/setup_eval_dataset.py --reset

      - name: Langfuse Eval 실행
        env:
          LANGFUSE_HOST: ${{ secrets.LANGFUSE_HOST }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          E2E_BASE_URL: http://${{ env.WIN_IP }}:8000
          E2E_LOGIN_ID: ${{ secrets.E2E_LOGIN_ID }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          RUN_NAME: pr-${{ github.event.pull_request.number || 'manual' }}-${{ github.sha }}
          # LLM-as-Judge (정보용 — CI 게이트 무관)
          JUDGE_AI_GATEWAY_URL: ${{ secrets.JUDGE_AI_GATEWAY_URL || 'http://localhost:4000' }}
          JUDGE_MODEL: ${{ secrets.JUDGE_MODEL || 'tier-simple' }}
          JUDGE_AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          JUDGE_ENABLED: "true"
        run: .eval-venv/bin/python scripts/run_eval.py

      - name: Langfuse UI 링크 출력
        if: always()
        env:
          LANGFUSE_HOST: ${{ secrets.LANGFUSE_HOST }}
        run: |
          echo "결과 확인: $LANGFUSE_HOST"
          echo "Datasets > chat-quality-golden-set > Runs"
