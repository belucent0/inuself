server {
    listen 3000;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 4g;

    # Docker DNS resolver (127.0.0.11)
    resolver 127.0.0.11 valid=30s ipv6=off;

    # gzip 압축
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;

    location = /ws {
        return 404;
    }

    location ^~ /ws/ {
        return 404;
    }

    # 정적 자산 캐싱 (빌드 해시가 포함된 파일)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API 프록시 (컨테이너 환경에서 백엔드로 전달)
    location /api/ {
        set $backend_upstream asr-backend:8000;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # SSE 스트리밍 지원
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Langfuse UI 프록시 (로컬 3000 접속 시에도 /langfuse/ 직접 접근 허용)
    location /langfuse/ {
        set $langfuse_upstream asr-langfuse:3000;
        proxy_pass http://$langfuse_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # iframe 임베드를 위해 Langfuse 헤더를 프록시에서 재정의
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        add_header X-Frame-Options "ALLOWALL" always;
        add_header Content-Security-Policy "frame-ancestors *" always;
    }

    # index.html - 항상 최신 버전 로드
    location = / {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files /index.html =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # SPA 라우팅 - 모든 경로를 index.html로 리다이렉트
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # 헬스체크 엔드포인트
    location /health {
        access_log off;
        return 200 "OK";
        add_header Content-Type text/plain;
    }
}
